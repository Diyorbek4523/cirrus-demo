<!doctype html>
<html lang="en" data-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cirrus — Tebex Theme Live Preview</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Official store">
  <meta name="theme-color" content="#0b0d17">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/cirrus.css">
  <!-- 1) Your settings. Edit config.js (or use the built-in customizer: add ?customize to the URL). -->
  <script src="config.js"></script>
  <!-- 2) Demo data, only used while token is "demo". Safe to delete when you go live. -->
  <script src="assets/demo-data.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="bg-fx" aria-hidden="true"></div>

  <div id="announce" class="announce" hidden></div>

  <header class="topbar" id="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="#/" id="brand">
        <img id="brand-logo" alt="" hidden>
        <span id="brand-name">Store</span>
      </a>
      <nav class="nav" id="nav" aria-label="Categories"></nav>
      <div class="top-actions">
        <button class="ip-pill" id="ip-pill" type="button" hidden>
          <span class="dot" aria-hidden="true"></span>
          <span class="ip-text"></span>
          <span class="ip-count"></span>
        </button>
        <button class="icon-btn" id="mode-btn" type="button" aria-label="Toggle light/dark mode">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
        </button>
        <button class="user-btn" id="user-btn" type="button" hidden></button>
        <button class="cart-btn" id="cart-btn" type="button" aria-label="Open basket">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
          <span class="cart-count" id="cart-count">0</span>
        </button>
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="footer" id="footer"></footer>

  <!-- Basket drawer -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Basket" aria-hidden="true"></aside>

  <!-- Modal (package details, login) -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" hidden>
    <div class="modal-box" id="modal-box"></div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="assets/cirrus.js"></script>
</body>
</html>
